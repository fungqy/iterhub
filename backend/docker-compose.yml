services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: iterhub-backend
    ports:
      - "8000:8000"
    environment:
      # ⚠ 凭据不落仓库:在 backend/.env 或 shell 环境中提供下列变量。
      - MSQL_DSN=${MSQL_DSN:?请设置环境变量 MSQL_DSN（完整 SQLAlchemy URL）}
      - HOST=0.0.0.0
      - PORT=8000
    volumes:
      - ./logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
    networks:
      - iterhub-network
    restart: unless-stopped

  db:
    image: mysql:8.0
    container_name: iterhub-mysql
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:?请设置环境变量 MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=iterdb
      - MYSQL_USER=iteruser
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:?请设置环境变量 MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./sql:/docker-entrypoint-initdb.d
    networks:
      - iterhub-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  iterhub-network:
    driver: bridge

volumes:
  mysql-data:
