apiVersion: v1
kind: ConfigMap
metadata:
  name: iterhub-nginx-config
data:
  default.conf: |
    server {
        listen 80;
        server_name localhost;
        root /usr/share/nginx/html;
        index index.html;

        # /iterhub 无尾斜杠 → 301 到 /iterhub/
        location = /iterhub {
            return 301 /iterhub/;
        }

        # 入口 HTML 必须每次回源校验:它决定这次要引用哪几个带 hash 的资源文件,
        # 缓存住就会出现「发了新版本、页面还引用旧 hash」的白屏。
        # ⚠ 这里用 expires 而不是 add_header Cache-Control:本 location 里一旦出现 add_header,
        #   server 级那几条安全头就会对它**整体失效**(见上),得原样再抄一遍;
        #   而 expires 是独立指令,不参与 add_header 的继承判定。
        location = /index.html {
            expires -1;
        }

        # 构建产物的文件名里带内容 hash(assets/index-C9eTtRN-.js),内容一变文件名就变,
        # 所以可以放心长缓存 —— 否则每次进页面/切路由都要为每个 chunk 发一次条件请求。
        # ⚠ 只覆盖 assets/ 目录:favicon.svg 这类不带 hash 的根文件不在此列,别顺手扩大范围。
        location /iterhub/assets/ {
            rewrite ^/iterhub/assets/(.*)$ /assets/$1 break;
            expires 1y;
        }

        # 静态资源 + SPA 回退:去掉 /iterhub 前缀交给 root 查找,
        # 避免 alias 与 try_files 组合的内部重定向循环(此前 assets 报 500)
        location /iterhub/ {
            rewrite ^/iterhub/(.*)$ /$1 break;
            try_files $uri $uri/ /index.html;
        }

        # 文档故障导入的唯一数据源是 297MB 的「应用平台现场问题沟通新.xlsx」
        # (390 张内嵌现场截图),须与后端 MAX_UPLOAD_BYTES(400MB)对齐抬高,
        # 否则超过 nginx 默认 1MB 的上传会在代理层被 413 挡掉。
        # 注:client_max_body_size 本身**会**继承到各 location,里层那条是冗余保险;
        #     add_header 才是不继承的那个 —— 这才是安全头必须写两处的原因。
        client_max_body_size 400m;

        # 安全响应头。add_header 的继承规则很反直觉:只要某个 location 里出现
        # 任何一条 add_header,server 级的这几条就对该 location **整体失效**,
        # 所以 /iterhub/api 内必须再写一份(见下),否则 API 响应会静默丢掉全部安全头。
        # ⚠ 本段与 frontend/nginx.conf 必须逐字保持同步:容器镜像用那份,k8s 用这份。
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; object-src 'none'; base-uri 'self';" always;

        location /iterhub/api {
            proxy_pass http://localhost:8000/api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            client_max_body_size 400m;
            # ⚠ 关闭请求体缓冲。默认(on)下 nginx 会先把整个请求体落盘到 client_body_temp 再转发,
            #   于是每传一次 297MB 的源表,代理侧就多写一份 297MB(后端 _spool_upload 那份仍然存在),
            #   有磁盘配额时会把容器的 ephemeral-storage 顶爆。关闭后请求体边收边转发、不再落盘,
            #   且 Content-Length 原样透传 —— 后端 _reject_oversize_upload 仍能在读 body 前拦超限。
            # ⚠ 响应侧的 proxy_buffering 保持默认 on:响应是 JSON/静态资源,关掉只会让前端变慢。
            # ⚠ 本段同样受「与 frontend/nginx.conf 逐字同步」约束,别只改一边。
            proxy_request_buffering off;
            # API 侧只返回 JSON,无需页面的样式/图片来源白名单,故 CSP 收紧为 default-src 'self'
            # (与 frontend/nginx.conf 逐字一致)
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
            add_header Content-Security-Policy "default-src 'self'";
        }

        gzip on;
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
        gzip_min_length 1000;
    }

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: iterhub
  labels:
    app: iterhub
spec:
  replicas: 1
  selector:
    matchLabels:
      app: iterhub
  template:
    metadata:
      labels:
        app: iterhub
    spec:
      containers:
      - name: iterhub-frontend
        image: harbor.zvos.zoomlion.com/embodied/iterhub-web:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
        volumeMounts:
        - name: nginx-config
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: default.conf
        # nginx 的临时目录默认落在容器可写层,而可写层计入容器的 ephemeral-storage;
        # 把它挪到一块**带上限**的 emptyDir 上,避免「一次异常缓冲 = 整个 Pod 被驱逐」。
        # ⚠ 正常上传不再经过这里:proxy_request_buffering 已在上面 ConfigMap 里关掉,
        #   这块盘是兜底上限(路径取 nginx 镜像的默认缓存目录,换基础镜像时要跟着改)。
        - name: nginx-cache
          mountPath: /var/cache/nginx
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
            # nginx 本体只吃几十 MB,CPU/内存维持原值——真正需要设限的是磁盘(见上)
            ephemeral-storage: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
            ephemeral-storage: "2Gi"
      - name: iterhub-service
        image: harbor.zvos.zoomlion.com/embodied/iterhub-service:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        env:
        # ⚠ 数据库 DSN 不再明文入库,改由 Secret 提供。首次部署需先创建:
        #     kubectl create secret generic iterhub-secrets \
        #       --from-literal=MSQL_DSN='mysql+pymysql://<user>:<password>@<host>:3306/<db>'
        #   更新 Secret 后需 kubectl rollout restart deployment iterhub 生效。
        - name: MSQL_DSN
          valueFrom:
            secretKeyRef:
              name: iterhub-secrets
              key: MSQL_DSN
        - name: HOST
          value: "0.0.0.0"
        - name: PORT
          value: "8000"
        # ⚠ 必须与 nginx 的 client_max_body_size 同步(上文本 ConfigMap 里的 400m),
        #    也和 backend 的默认上限 400MiB 一致。这里原本是 209715200(200MiB),
        #    而唯一的数据源「应用平台现场问题沟通新.xlsx」实测 283.6MiB —— 于是上传会
        #    在 nginx 放行之后被后端 413 挡回,现象和"文件损坏"一模一样。
        - name: MAX_UPLOAD_BYTES
          value: "419430400"
        # ⚠ startupProbe:启动期要 import pandas/numpy(holidays)与 openpyxl(data_import 模块级),
        #    还要建默认账号、起调度器,慢节点上可能超过 liveness 的 30s 初值就判定失败 ——
        #    于是容器被杀掉重启,启动永远追不上判死。startupProbe 生效期间 liveness/readiness
        #    都不执行,这里给足 150s(5s × 30);一旦通过就交回下面两个探针。
        startupProbe:
          httpGet:
            path: /livez
            port: 8000
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 30
        # ⚠ liveness 必须探 /livez(只证明进程活着),**不能**探 /health:
        #    /health 会在 MySQL/调度器不可用时返回 503,而 livenessProbe 失败
        #    会让 kubelet 杀掉并重启容器 —— 数据库抖动会被放大成容器反复重启
        #    (进程内 APScheduler 状态一并丢失),且库不恢复就永远起不来。
        livenessProbe:
          httpGet:
            path: /livez
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 5
        # readiness 探 /health:依赖不可用 ⇒ 503 ⇒ 摘流量但不重启进程。
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        # ⚠ 下面的值是按「文档故障导入」这条主链路定的,不是按普通 CRUD:
        #   1) 内存:进程基线本就不低(启动即拉起 pandas+numpy,openpyxl 模块级 import),
        #      导入时 PIL 单张解码还受 doc_bug_images.MAX_THUMB_PIXELS(40MP)约束 ——
        #      RGBA 解码约 160MB,加中间态与 WebP 编码缓冲,单张最坏瞬时 300-400MB,
        #      两人同时导入即叠加;旧上限 1Gi 离 OOMKill 只差一次并发,
        #      而 OOM 重启会连带丢掉进程内 APScheduler 状态。
        #   2) CPU:导入是纯 CPU 密集(openpyxl 持 GIL + 390 张图 PIL 解码 + WebP method=4),
        #      旧的 1000m 会被 CFS 限流 ⇒ 导入从「数十秒」拖成数分钟,同期接口一起变慢。
        #   3) ephemeral-storage:每次上传都在 /tmp 落一份 297MB 临时文件(_spool_upload),
        #      旧配置完全没设限,只能等节点 DiskPressure 来驱逐;2Gi ≈ 容忍 6 份并发上传。
        resources:
          requests:
            cpu: "500m"
            memory: "512Mi"
            ephemeral-storage: "512Mi"
          limits:
            cpu: "2000m"
            memory: "2Gi"
            ephemeral-storage: "2Gi"
      volumes:
      - name: nginx-config
        configMap:
          name: iterhub-nginx-config
      # 前端容器的 nginx 临时目录(见上面的 volumeMounts):挂 emptyDir 并加上限,
      # 免得「一次异常缓冲」直接打爆可写层(可写层计入 ephemeral-storage)
      - name: nginx-cache
        emptyDir:
          sizeLimit: 2Gi

---
apiVersion: v1
kind: Service
metadata:
  name: iterhub-service
spec:
  selector:
    app: iterhub
  ports:
  - name: frontend
    port: 80
    targetPort: 80
    nodePort: 30801
  type: NodePort
