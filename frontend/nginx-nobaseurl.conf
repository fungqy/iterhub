server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # 根路径部署版(**无** /iterhub 前缀),由 frontend/Dockerfile-nobaseurl 打进镜像,
    # 与 deployment-nobaseurl.yml 里挂载的 nginx ConfigMap 保持同一套 location 布局。
    # ⚠ 它和 frontend/nginx.conf(/iterhub/ 前缀版)**故意不同**,两份各有各的部署目标,
    #   别按"必须逐字一致"去互相同步 —— 那样会把前缀加回到根路径部署里。
    # ⚠ 与 k8s 那份唯一的差异只有 proxy_pass 的后端地址:容器内走 compose 服务名
    #   backend:8000;k8s 两个容器共用一个 Pod 网络命名空间,走 localhost:8000。

    # ⚠ 上传体积上限。此前本文件没写这一条,吃的是 nginx 默认 1MB ——
    # 也就是说任何超过 1MB 的 Excel 都会在代理层被 413 挡掉,
    # 根本到不了后端的 MAX_UPLOAD_BYTES。文档故障导入的源文件是 297MB
    # (390 张内嵌现场截图),故与后端上限(400MB)对齐抬高。
    client_max_body_size 400m;

    # 安全响应头。add_header 的继承规则很反直觉:只要某个 location 里出现任何一条
    # add_header,server 级的这几条就对该 location **整体失效**,故下面的 /api 里
    # 必须再写一份,否则 API 响应会静默丢掉全部安全头。
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; object-src 'none'; base-uri 'self';" always;

    # API 反向代理:根路径部署下前端请求的就是 /api(axios baseURL = VITE_BASE + 'api'),
    # 无需再做前缀剥离。
    location /api {
        proxy_pass http://backend:8000/api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        # client_max_body_size 本身会从 server 级继承,这条是冗余保险(与 k8s 那份逐字一致)
        client_max_body_size 400m;
        # ⚠ 关闭请求体缓冲。默认(on)下 nginx 会先把整个请求体落盘到 client_body_temp 再转发,
        #   于是每传一次 297MB 的源表,代理侧就多写一份 297MB(后端 _spool_upload 那份仍然存在),
        #   有磁盘配额时会把容器的 ephemeral-storage 顶爆。关闭后请求体边收边转发、不再落盘,
        #   且 Content-Length 原样透传 —— 后端 _reject_oversize_upload 仍能在读 body 前拦超限。
        # ⚠ 响应侧的 proxy_buffering 保持默认 on:响应是 JSON/静态资源,关掉只会让前端变慢。
        # ⚠ 本段同样受「与 deployment-nobaseurl.yml 里的 ConfigMap 逐字同步」约束,别只改一边。
        proxy_request_buffering off;
        # API 侧只返回 JSON,无需前端页面相关指令,收紧 CSP
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'";
    }

    # 静态资源 + SPA 回退:根路径部署,直接交给 root 查找,无需再 rewrite 剥前缀。
    # 前缀匹配取最长者,故 /api 不会被这里吃掉。
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1000;
}
