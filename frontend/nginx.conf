server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # VITE_BASE=/iterhub/(见 Dockerfile),前端构建产物与路由均以 /iterhub 为基路径;
    # 本配置与 deployment.yml 中挂载的 nginx ConfigMap 布局保持一致。

    # ⚠ 上传体积上限。此前本文件没写这一条,吃的是 nginx 默认 1MB ——
    # 也就是说 compose 部署下任何超过 1MB 的 Excel 都会在代理层被 413 挡掉,
    # 根本到不了后端的 MAX_UPLOAD_BYTES。文档故障导入的源文件是 297MB
    # (390 张内嵌现场截图),故与后端上限(400MB)对齐抬高。
    client_max_body_size 400m;

    # 安全响应头:add_header 不会从 server{} 继承到含 proxy_pass 的 location,
    # 故 /iterhub/api 内需单独再放一份。
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; object-src 'none'; base-uri 'self';" always;

    # /iterhub 无尾斜杠 → 301 到 /iterhub/
    location = /iterhub {
        return 301 /iterhub/;
    }

    # API 反向代理:把 /iterhub/api 前缀替换为后端 /api 前缀(compose 内部走 backend:8000)
    location /iterhub/api {
        proxy_pass http://backend:8000/api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        # ⚠ 关闭请求体缓冲。默认(on)下 nginx 会先把整个请求体落盘到 client_body_temp 再转发,
        #   于是每传一次 297MB 的源表,代理侧就多写一份 297MB(后端 _spool_upload 那份仍然存在),
        #   有磁盘配额时会把容器的 ephemeral-storage 顶爆。关闭后请求体边收边转发、不再落盘,
        #   且 Content-Length 原样透传 —— 后端 _reject_oversize_upload 仍能在读 body 前拦超限。
        # ⚠ 响应侧的 proxy_buffering 保持默认 on:响应是 JSON/静态资源,关掉只会让前端变慢。
        # ⚠ 本段同样受「与 deployment.yml 里的 ConfigMap 逐字同步」约束,别只改一边。
        proxy_request_buffering off;
        # API 侧无需前端页面相关指令,收紧 CSP
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'";
    }

    # 入口 HTML 必须每次回源校验:它决定这次要引用哪几个带 hash 的资源文件,
    # 缓存住就会出现「发了新版本、页面还引用旧 hash」的白屏。
    # ⚠ 这里用 expires 而不是 add_header Cache-Control:本 location 里一旦出现 add_header,
    #   server 级那几条安全头就会对它**整体失效**(见上),得原样再抄一遍;
    #   而 expires 是独立指令,不参与 add_header 的继承判定。
    location = /index.html {
        expires -1;
    }

    # 构建产物的文件名里带内容 hash(assets/index-C9eTtRN-.js),内容一变文件名就变,
    # 所以可以放心长缓存 —— 否则每次进页面/切路由都要为每个 chunk 发一次条件请求。
    # ⚠ 只覆盖 assets/ 目录:favicon.svg 这类不带 hash 的根文件不在此列,别顺手扩大范围。
    location /iterhub/assets/ {
        rewrite ^/iterhub/assets/(.*)$ /assets/$1 break;
        expires 1y;
    }

    # 静态资源 + SPA 回退:去掉 /iterhub 前缀交给 root 查找,
    # 避免 alias 与 try_files 组合的内部重定向循环(此前 assets 报 500)
    location /iterhub/ {
        rewrite ^/iterhub/(.*)$ /$1 break;
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1000;
}
