server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # VITE_BASE=/iterhub/(见 Dockerfile),前端构建产物与路由均以 /iterhub 为基路径;
    # 本配置与 deployment.yml 中挂载的 nginx ConfigMap 布局保持一致。

    # ⚠ 上传体积上限。此前本文件没写这一条,吃的是 nginx 默认 1MB ——
    # 也就是说 compose 部署下任何超过 1MB 的 Excel 都会在代理层被 413 挡掉,
    # 根本到不了后端的 MAX_UPLOAD_BYTES。文档故障导入的源文件是 297MB
    # (390 张内嵌现场截图),故与后端上限(400MB)对齐抬高。
    client_max_body_size 400m;

    # 安全响应头:add_header 不会从 server{} 继承到含 proxy_pass 的 location,
    # 故 /iterhub/api 内需单独再放一份。
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; object-src 'none'; base-uri 'self';" always;

    # /iterhub 无尾斜杠 → 301 到 /iterhub/
    location = /iterhub {
        return 301 /iterhub/;
    }

    # API 反向代理:把 /iterhub/api 前缀替换为后端 /api 前缀(compose 内部走 backend:8000)
    location /iterhub/api {
        proxy_pass http://backend:8000/api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        # API 侧无需前端页面相关指令,收紧 CSP
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'";
    }

    # 静态资源 + SPA 回退:去掉 /iterhub 前缀交给 root 查找,
    # 避免 alias 与 try_files 组合的内部重定向循环(此前 assets 报 500)
    location /iterhub/ {
        rewrite ^/iterhub/(.*)$ /$1 break;
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1000;
}
