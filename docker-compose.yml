services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # ⚠ 只传 VITE_BASE。VITE_API_HOST 已删除:它对构建产物无效(见 frontend/Dockerfile),
        #   前端 api 基址恒为 VITE_BASE + 'api',由 nginx 的 /iterhub/api 反代到 backend:8000。
        - VITE_BASE=/iterhub/
    container_name: iterhub-frontend
    ports:
      - "8188:80"
    depends_on:
      - backend
    networks:
      - iterhub-network
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: iterhub-backend
    ports:
      - "8008:8000"
    environment:
      # ⚠ 真实 DSN 不落仓库:在仓库根目录 .env 或 shell 环境中提供 MSQL_DSN。
      #    未提供时 docker compose 会直接报错退出,避免静默回退到弱口令。
      - MSQL_DSN=${MSQL_DSN:?请设置环境变量 MSQL_DSN（完整 SQLAlchemy URL）}
      - HOST=0.0.0.0
      - PORT=8000
      # 显式写出(与 backend 默认 400MiB 同值):文档故障的唯一数据源实测 283.6MiB,
      # 与 nginx 的 client_max_body_size 400m 必须成对保持一致。
      - MAX_UPLOAD_BYTES=419430400
    volumes:
      - ./backend/logs:/app/logs
    networks:
      - iterhub-network
    restart: unless-stopped

networks:
  iterhub-network:
    driver: bridge
